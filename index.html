<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Glorious Destiny : perruques, pose de cils et produits professionnels."
    />
    <!-- Préparation PWA (Phase 12) : couleur de la barre du navigateur mobile. -->
    <meta name="theme-color" content="#ecebe7" />
    <meta name="color-scheme" content="light dark" />
    <!-- Thème choisi par la visiteuse, appliqué avant le premier rendu (src/features/theme). -->
    <script>
      try {
        if (localStorage.getItem('gd-theme') === 'sombre') {
          document.documentElement.dataset.theme = 'sombre'
          document.querySelector('meta[name="theme-color"]').content = '#111110'
        }
      } catch (e) {}
    </script>
    <title>Glorious Destiny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
